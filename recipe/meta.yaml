{% set python_min = "3.11" %}
{% set name = "ptychodus" %}
{% set version = "1.7.0" %}

package:
  name: ptychodus-split
  version: {{ version }}

source:
  url: https://github.com/AdvancedPhotonSource/ptychodus/archive/refs/tags/v{{ version }}.zip
  sha256: 15a1a83520442855e56a6451c80a2f17ce85418b3a8327643fa557aaf4c93aa0

build:
  number: 0

outputs:
  # all optional packages
  - name: ptychodus-all

    build:
      noarch: generic

    requirements:
      run:
        - {{ pin_subpackage('ptychodus', exact=True) }}

    test:
      imports:
        - ptychodus
      requires:
        - pip
      commands:
        - pip check
        - ptychodus --version

  # with QT
  - name: ptychodus

    build:
      noarch: generic

    requirements:
      run:
        - {{ pin_subpackage('ptychodus-core', exact=True) }}
        - pyqt

    test:
      imports:
        - ptychodus
      requires:
        - pip
      commands:
        - pip check
        - ptychodus --version

  # ptychodus without QT (headless) without optional packages
  - name: ptychodus-core

    script: build-core.sh

    build:
      noarch: python
      entry_points:
        - convert-to-ptychodus = ptychodus.cli.convert_to_ptychodus:main
        - ptychodus = ptychodus.__main__:main
        - ptychodus-bdp = ptychodus.cli.bdp:main
        - ptychodus-system-check = ptychodus.cli.system_check:main

    requirements:
      host:
        - pip
        - python {{ python_min }}
        - setuptools >=80
        - setuptools_scm >=9.2
      run:
        - colorcet
        - h5py >=3
        - hdf5plugin
        - httpx
        - matplotlib-base
        - mlflow-skinny
        - numpy
        # conda-only dep with no counterpart in upstream pyproject.toml:
        # conda-forge's pydantic-ai is a thin wrapper over pydantic-ai-slim and
        # mirrors none of PyPI's provider extras, so the OpenAI provider that
        # ptychodus selects at runtime is otherwise missing. Do not remove.
        - openai
        - psutil
        - pydantic
        - pydantic-ai >=1.0,<3
        - python >={{ python_min }}
        - pyyaml
        - scikit-image
        - scikit-learn
        - scipy
        - tifffile
        - watchdog
      run_constrained:
        - globus-sdk >=4.5.0
        - globus-compute-sdk
        - pyqt =5.*

    test:
      imports:
        - ptychodus
      requires:
        - pip
        - python {{ python_min }}
      commands:
        - pip check
        - ptychodus --version
        # One line per entry point: conda-build generates these wrappers from the
        # list above, so an upstream module rename ships broken binaries while a
        # test that only runs `ptychodus --version` stays green.
        - convert-to-ptychodus --help
        - ptychodus-bdp --help
        - ptychodus-system-check --help

about:
  home: https://github.com/AdvancedPhotonSource/ptychodus
  summary: Ptychodus is a ptychography data pipeline application.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/AdvancedPhotonSource/ptychodus

extra:
  recipe-maintainers:
    - AdvancedPhotonSource/ptychodus
    - carterbox
    - stevehenke
